<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion | L’antre du capricorne', 'Connecte-toi à ton espace personnel.', 'noindex,nofollow')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container narrow">
    <h1>Connexion</h1>

    <p class="notice" th:if="${param.inscrit != null}" role="status">Compte créé ! Tu peux maintenant te connecter.</p>
    <p class="error" th:if="${param.erreur != null}" role="alert">E-mail ou mot de passe incorrect.</p>
    <p class="error" th:if="${param.limite != null}" role="alert">Trop de tentatives. Réessaie dans quelques minutes.</p>
    <p class="error" th:if="${param.indisponible != null}" role="alert">Service momentanément indisponible. Réessaie dans un instant.</p>

    <!-- th:action ajoute tout seul le jeton CSRF caché : sans lui, le serveur refuse le formulaire. -->
    <form th:action="@{/connexion}" method="post" class="card form">
        <label for="email">Adresse e-mail</label>
        <input id="email" name="email" type="email" required maxlength="254" autocomplete="username" autofocus>

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" required maxlength="72" autocomplete="current-password">

        <button type="submit" class="button">Se connecter</button>
    </form>
    <p class="muted">Pas encore de compte ? <a th:href="@{/inscription}">Inscris-toi</a>.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
